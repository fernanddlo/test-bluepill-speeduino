[env:genericSTM32F103C8]
platform = ststm32
board = genericSTM32F103C8
framework = stm32cube
monitor_speed = 115200
monitor_port = COM3
build_flags = 
    -D STM32F103xB
    -D USE_HAL_DRIVER
    -Wl,--gc-sections
    -Os
lib_deps = 
    stm32f1xx-hal

; Frequência do MCU
board_build.f_cpu = 72000000L

; Protocolo de upload
upload_protocol = stlink
upload_speed = 115200





